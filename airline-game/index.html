<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airline Pricing Game</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#5d6672;--line:#e3e6ea;--me:#1f6feb;--riv:#d9480f;--good:#2b8a3e;--bad:#c92a2a;--soft:#eef4ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2rem 0}
h2{font-size:1.15rem;margin:0 0 .6rem}
.sub{color:var(--mute);margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:600;cursor:pointer;font-size:1rem}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fact{background:var(--bg);border-radius:8px;padding:8px 10px}
.fact b{display:block;font-size:1.05rem}
.fact span{font-size:.82rem;color:var(--mute)}
.hint{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
button.go{background:var(--me);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.4;cursor:default}
button.ghost{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.9rem}
.steps{display:flex;gap:6px;margin-bottom:12px}
.step{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:var(--bg);font-size:.85rem;color:var(--mute)}
.step.now{background:var(--me);color:#fff;font-weight:600}
.step.done{background:#dbe7fb;color:var(--ink)}
.pricebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
input[type=range]{flex:1;min-width:180px;accent-color:var(--me)}
input[type=number]{width:90px;font-size:1.1rem;padding:6px;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:.82rem}
.me{color:var(--me);font-weight:600}.riv{color:var(--riv);font-weight:600}
.big{font-size:2rem;font-weight:700}
.pos{color:var(--good)}.neg{color:var(--bad)}
.poll{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px
